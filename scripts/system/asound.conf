# "projector": the Pi 4's HDMI0 audio (vc4hdmi0), used by UxPlay and the
# Chromecast audio loop. The vc4 HDMI driver only accepts IEC958 frames; the
# hdmi: device wraps the needed conversion, and plug handles rate/format.
#
# This device isn't shared (no dmix), so only one of AirPlay/Chromecast can
# play audio at a time; the other retries until it's free.
pcm.projector {
    type plug
    slave.pcm "hdmi:CARD=vc4hdmi0,DEV=0"
}
