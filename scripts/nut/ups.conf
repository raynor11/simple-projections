# APC BE600M1 on USB. offdelay/ondelay set the UPS's own timers used by
# NUT's final-stage "kill power": after the Pi halts, the UPS cuts its
# output offdelay seconds later, and turns it back on once wall power has
# been back for ondelay seconds -- which boots the Pi again.
[apc]
    driver = usbhid-ups
    port = auto
    desc = "APC BE600M1"
    offdelay = 20
    ondelay = 30
