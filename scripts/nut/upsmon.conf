# upsmon shuts the Pi down on low battery (a safety net), and performs the
# forced shutdown projector-control requests with `upsmon -c fsd` after it
# has turned the projector off. POWERDOWNFLAG tells NUT's shutdown hook to
# have the UPS cut and later restore its output.
MONITOR apc@localhost 1 upsmon @UPSMON_PASSWORD@ primary
MINSUPPLIES 1
SHUTDOWNCMD "/sbin/shutdown -h +0"
POWERDOWNFLAG /etc/killpower
FINALDELAY 5
